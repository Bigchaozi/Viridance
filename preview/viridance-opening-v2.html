<div class="controls" hidden>
  <button id="skip" type="button">跳到结尾</button>
  <button id="replay" type="button">重播</button>
</div>
<script>
  const scenes = [...document.querySelectorAll('.scene')];
  const logo = document.querySelector('.logo');
  const canvas = document.querySelector('.smoke');
  const ctx = canvas.getContext('2d');
  const controls = document.querySelector('.controls');
  const skip = document.querySelector('#skip');
  const replay = document.querySelector('#replay');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const timeline = [
    { start: 0, end: 1550, mode: 'words', stagger: 350 },
    { start: 1550, end: 2800, mode: 'zoom' },
    { start: 2800, end: 3850, mode: 'words', stagger: 135 },
    { start: 3850, end: 4750, mode: 'slide' },
    { start: 4750, end: 6250, mode: 'settle' }
  ];
  const revealStart = timeline.at(-1).end;
  const revealDuration = 1750;
  const end = revealStart + revealDuration;
  const clamp = value => Math.max(0, Math.min(1, value));
  const ease = value => 1 - (1 - clamp(value)) ** 4;
  let frame;
  let visibleScene = -1;

  function buildParticles() {
    const sample = document.createElement('canvas');
    sample.width = 420;
    sample.height = Math.round(420 * logo.naturalHeight / logo.naturalWidth);
    const surface = sample.getContext('2d', { willReadFrequently: true });
    surface.drawImage(logo, 0, 0, sample.width, sample.height);
    const { data } = surface.getImageData(0, 0, sample.width, sample.height);
    let seed = 18403;
    function random() {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    const points = [];
    for (let y = 0; y < sample.height; y++) {
      for (let x = 0; x < sample.width; x++) {
        const index = (y * sample.width + x) * 4;
        if (data[index + 3] < 128 || Math.min(...data.subarray(index, index + 3)) > 210 || random() > .32) continue;
        points.push({
          x: x / sample.width, y: y / sample.height,
          drift: (random() - .35) * 120,
          lift: (random() - .78) * 115,
          size: .42 + random() * 1.7,
          life: .22 + random() * .24,
          phase: random() * Math.PI * 2,
          color: `rgb(${data[index]}, ${data[index + 1]}, ${data[index + 2]})`
        });
      }
    }
    return points;
  }

  function renderText(index, elapsed) {
    const scene = scenes[index];
    const beat = timeline[index];
    const line = scene.querySelector('.line');
    const exit = clamp(1 - (beat.end - beat.start - elapsed) / 285);
    const travel = exit ** 2;
    const enter = 1 - (1 - clamp(elapsed / 500)) ** 3;
    scene.style.opacity = 1 - exit ** 1.4;
    if (beat.mode === 'words') {
      scene.querySelectorAll('.word').forEach((word, position) => {
        const progress = clamp((elapsed - position * beat.stagger) / 510);
        const rise = 1 - (1 - progress) ** 2;
        word.style.opacity = progress ** 1.2;
        word.style.transform = `translateY(${(1 - rise) * 1.25}em)`;
      });
      line.style.transform = `translateY(${-travel * 1.1}em)`;
    } else {
      const zoom = beat.mode === 'zoom' ? 3.2 : .28;
      const scale = (beat.mode === 'slide' ? 1 : 1 + zoom * (1 - enter))
        * (1 + (beat.mode === 'zoom' ? .42 : -.16) * travel);
      const x = beat.mode === 'slide' ? (1 - enter) * 60 - travel * 38 : 0;
      const y = beat.mode === 'slide' ? 0 : (1 - enter) * .55 - travel * .9;
      line.style.opacity = clamp(elapsed / (beat.mode === 'zoom' ? 260 : 380)) ** 1.1;
      line.style.transform = `translate(${x}%, ${y}em) scale(${scale})`;
    }
  }

  function renderLogo(time, particles) {
    const progress = clamp((time - revealStart) / revealDuration);
    const sweep = clamp(progress / .78);
    logo.style.visibility = time >= revealStart ? 'visible' : 'hidden';
    logo.style.maskImage = progress >= 1 ? 'none' : `linear-gradient(90deg, #000 ${sweep * 108 - 8}%, transparent ${sweep * 108}%)`;
    if (!ctx) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (progress <= 0 || progress >= 1) return;
    const width = canvas.width * .66;
    const height = width * logo.naturalHeight / logo.naturalWidth;
    const left = (canvas.width - width) / 2;
    const top = (canvas.height - height) / 2;
    for (const point of particles) {
      const age = (progress - point.x * .78) / point.life;
      if (age <= 0 || age >= 1) continue;
      const spread = ease(age);
      const x = left + point.x * width + spread * point.drift;
      const y = top + point.y * height + spread * point.lift + Math.sin(point.phase + age * 5) * age * 15;
      const size = point.size * (1 + age * 1.75);
      const opacity = Math.sin(age * Math.PI) * (1 - age) * Math.min(1, (1 - progress) * 12);
      ctx.globalAlpha = opacity * .32;
      ctx.fillStyle = point.color;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = opacity * .04;
      ctx.beginPath();
      ctx.arc(x, y, size * 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function initialize() {
    const particles = ctx ? buildParticles() : [];
    function render(time) {
      const index = timeline.findIndex(beat => time >= beat.start && time < beat.end);
      if (visibleScene !== index) {
        scenes[visibleScene]?.classList.remove('active');
        scenes[index]?.classList.add('active');
        visibleScene = index;
      }
      if (index >= 0) renderText(index, time - timeline[index].start);
      renderLogo(time, particles);
      skip.hidden = time >= end;
    }
    function finish() {
      cancelAnimationFrame(frame);
      render(end);
    }
    function play() {
      cancelAnimationFrame(frame);
      if (reducedMotion.matches) return finish();
      const start = performance.now();
      render(0);
      function tick(now) {
        const elapsed = Math.min(end, now - start);
        render(elapsed);
        if (elapsed < end) frame = requestAnimationFrame(tick);
      }
      frame = requestAnimationFrame(tick);
    }
    replay.addEventListener('click', play);
    skip.addEventListener('click', finish);
    reducedMotion.addEventListener('change', event => { if (event.matches) finish(); });
    const params = new URLSearchParams(location.search);
    if (params.has('t')) {
      const time = Number(params.get('t'));
      render(Number.isFinite(time) ? Math.max(0, Math.min(end, time)) : end);
    } else {
      controls.hidden = false;
      play();
    }
  }

  logo.decode().then(initialize).catch(error => console.error('片头初始化失败', error));
</script>
