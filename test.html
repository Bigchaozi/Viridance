<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>片头背景效果</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  .stage { position: fixed; inset: 0; }

  /* ===== 内联自 intro/css/liquid-background.css：片头液态渐变背景 ===== */
  .liquid-preview__wash { position: absolute; inset: 0; overflow: hidden; background: #fff; }
  .liquid-preview__color { position: absolute; inset: -45%; }
  .liquid-preview__color--sage {
    background: radial-gradient(ellipse 18% 22% at 34% 40%, #d3f5be 0%, #d3f5be 29%, #ebfbe1 70%, #ebfbe100 100%);
    animation: liquid-sage 16s cubic-bezier(.42, 0, .58, 1) infinite;
  }
  .liquid-preview__color--mint {
    background: radial-gradient(ellipse 16% 20% at 62% 58%, #dbf6cc 0%, #dbf6cc 29%, #effce8 70%, #effce800 100%);
    animation: liquid-mint 16s cubic-bezier(.42, 0, .58, 1) infinite;
  }
  .liquid-preview__wash::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse 38% 56% at 50% 48%, #fff 22%, #fffffff5 45%, #fff0 100%);
    pointer-events: none;
  }
  @keyframes liquid-sage {
    0%, 100% { transform: translate(-13%, -6%) rotate(-12deg); }
    25% { transform: translate(14%, -17%) rotate(4deg); }
    50% { transform: translate(28%, 12%) rotate(16deg); }
    75% { transform: translate(4%, 20%) rotate(4deg); }
  }
  @keyframes liquid-mint {
    0%, 100% { transform: translate(14%, 14%) rotate(10deg); }
    25% { transform: translate(-17%, 14%) rotate(-6deg); }
    50% { transform: translate(-27%, -10%) rotate(-18deg); }
    75% { transform: translate(2%, -19%) rotate(-2deg); }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="liquid-preview__wash" aria-hidden="true">
      <div class="liquid-preview__color liquid-preview__color--sage"></div>
      <div class="liquid-preview__color liquid-preview__color--mint"></div>
    </div>
  </div>
</body>
</html>
